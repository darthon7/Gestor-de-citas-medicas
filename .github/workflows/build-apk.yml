name: Build & Release Android APK

on:
  push:
    branches:
      - master
    paths:
      - 'Movil-citasmedicas/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: Movil-citasmedicas/citasmedicas

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: Movil-citasmedicas/citasmedicas

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Movil-citasmedicas/citasmedicas/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-latest
          name: '📱 App Móvil - Última Versión'
          body: |
            🚀 **Compilación Automática del APK**
            - Este APK fue generado automáticamente en la nube tras el último commit en la rama `master`.
            - Descarga e instala `app-debug.apk` en tu dispositivo Android.
          files: Movil-citasmedicas/citasmedicas/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
