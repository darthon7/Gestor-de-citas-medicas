name: Build & Release Android APK

on:
  push:
    branches:
      - master
    paths:
      - 'Movil-citasmedicas/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: Movil-citasmedicas/citasmedicas

      - name: Inject run number into build.gradle.kts
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/g" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"1.0.${{ github.run_number }}\"/g" app/build.gradle.kts
          sed -i "s/buildConfigField(\"int\", \"GITHUB_RUN_NUMBER\", \"[0-9]*\")/buildConfigField(\"int\", \"GITHUB_RUN_NUMBER\", \"${{ github.run_number }}\")/g" app/build.gradle.kts
          echo "Gradle versionCode actualizado a ${{ github.run_number }}"
        working-directory: Movil-citasmedicas/citasmedicas

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: Movil-citasmedicas/citasmedicas

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Movil-citasmedicas/citasmedicas/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: '📱 App Móvil - Versión 1.0.${{ github.run_number }}'
          body: |
            🚀 **Compilación Automática del APK**
            - Este APK fue generado automáticamente en la nube tras el último commit en la rama `master`.
            - Descarga e instala `app-debug.apk` en tu dispositivo Android.
          files: Movil-citasmedicas/citasmedicas/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Registrar versión en Backend
        if: github.ref == 'refs/heads/master'
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://gestor-de-citas-medicas.onrender.com"
          fi
          DEPLOY_TOKEN="${{ secrets.DEPLOY_TOKEN }}"
          if [ -z "$DEPLOY_TOKEN" ]; then
            DEPLOY_TOKEN="secret-deploy-token-citas"
          fi
          echo "Notificando a $BACKEND_URL sobre la versión 1.0.${{ github.run_number }}..."
          curl -X POST "$BACKEND_URL/api/app-version" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -d '{
              "version": "1.0.${{ github.run_number }}",
              "run_number": ${{ github.run_number }},
              "download_url": "https://github.com/darthon7/Gestor-de-citas-medicas/releases/tag/v1.0.${{ github.run_number }}",
              "notas": "Compilación automática del APK #${{ github.run_number }}"
            }'

