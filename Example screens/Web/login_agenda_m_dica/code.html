<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        
        .login-card {
            box-shadow: 0 2px 12px rgba(27, 107, 147, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .login-card:hover {
            box-shadow: 0 4px 20px rgba(27, 107, 147, 0.14);
        }

        .input-focus-glow:focus {
            outline: none;
            border-color: #1b6b93;
            box-shadow: 0 0 0 2px rgba(27, 107, 147, 0.1);
        }

        .bg-login-gradient {
            background: linear-gradient(135deg, #f7f9fc 0%, #A8D5E2 100%);
        }

        /* Medical pulse effect for button or small indicators */
        @keyframes medical-pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        .pulse-dot {
            animation: medical-pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-login-gradient min-h-screen flex items-center justify-center font-body-md text-on-surface p-4">
<!-- Login Container -->
<main class="w-full max-w-[440px] z-10">
<!-- Login Card -->
<div class="bg-surface login-card rounded-xl p-8 md:p-10 flex flex-col items-center">
<!-- Brand Identity -->
<div class="mb-8 flex flex-col items-center">
<div class="w-24 h-24 mb-6">
<!-- Identity Image from JSON/Prompt -->
<img alt="Agenda Médica Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlK5cH181k5-nGiZ071qgj00u4NbeDzO4MHskLGK2bvPJqmOrxt0z5ci8RrRrFZPLo4A1LSvEsbu1PvM7NN6rrYMs5kxLldtHCYkWLwnHuBR1SZvTe45ViQCOz5wJu9NeRx1HgKjUyfnAE1civzTSy4R1Hej6pTiKQ9eCYzZOhID49Q-QwXdIggWk-sY_ubz3_xCyPcmqYfLK1TJRGrxwpU3hqHmyR_4xTCgffUsjF0dLrJffDc5OVl7wxGrOwGKoTW7NLzXwvr4M"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary-dark tracking-tight">Agenda Médica</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-center">Acceso administrativo al Hospital Central</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-6" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Correo Electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-border rounded-lg input-focus-glow font-body-md text-on-surface transition-all" id="email" name="email" placeholder="admin@hospitalcentral.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-dark transition-colors" href="#">¿Olvidó su contraseña?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-white border border-border rounded-lg input-focus-glow font-body-md text-on-surface transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-2">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary-light" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Mantener sesión iniciada</label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary py-3.5 px-6 rounded-lg font-label-md text-label-md shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center space-x-2" type="submit">
<span>Ingresar</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<!-- Footer / Secondary Actions -->
<div class="mt-8 pt-6 border-t border-outline-variant w-full text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    ¿No tienes una cuenta? 
                    <a class="text-primary font-label-md hover:underline decoration-2 underline-offset-4" href="#">Solicitar Acceso</a>
</p>
</div>
</div>
<!-- System Status Indicator (Healthcare Specific) -->
<div class="mt-8 flex items-center justify-center space-x-3 text-on-primary-fixed-variant opacity-80">
<div class="w-2 h-2 rounded-full bg-secondary pulse-dot"></div>
<span class="font-caption text-caption">Servidores en línea - Acceso Seguro SSL</span>
</div>
</main>
<!-- Decorative Background Elements -->
<div class="fixed inset-0 pointer-events-none overflow-hidden -z-0">
<div class="absolute -top-[10%] -left-[5%] w-[400px] h-[400px] bg-primary-light/10 blur-[100px] rounded-full"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[500px] h-[500px] bg-secondary-light/20 blur-[100px] rounded-full"></div>
</div>
<!-- Micro-interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const submitBtn = form.querySelector('button[type="submit"]');

            form.addEventListener('submit', (e) => {
                const btnSpan = submitBtn.querySelector('span:first-child');
                const btnIcon = submitBtn.querySelector('.material-symbols-outlined');
                
                // Visual feedback for button press
                btnSpan.textContent = 'Autenticando...';
                btnIcon.textContent = 'sync';
                btnIcon.classList.add('animate-spin');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-70');

                // Simulate loading (purely for UI/UX feeling)
                setTimeout(() => {
                    btnSpan.textContent = 'Éxito';
                    btnIcon.textContent = 'check_circle';
                    btnIcon.classList.remove('animate-spin');
                    submitBtn.classList.replace('bg-primary-container', 'bg-secondary');
                    
                    // Here you would normally redirect
                    console.log('Login attempt captured in demo mode.');
                }, 1500);
            });

            // Password visibility toggle
            const togglePass = document.querySelector('button[type="button"]');
            const passInput = document.getElementById('password');
            togglePass.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                togglePass.querySelector('.material-symbols-outlined').textContent = isPass ? 'visibility_off' : 'visibility';
            });
        });
    </script>
</body></html>
