<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediAdmin - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#70787f",
                        "inverse-primary": "#8bcefb",
                        "on-surface": "#191c1e",
                        "primary": "#005275",
                        "surface-variant": "#e0e3e6",
                        "on-tertiary": "#ffffff",
                        "surface": "#FFFFFF",
                        "on-primary": "#ffffff",
                        "danger-light": "#FADED4",
                        "tertiary-fixed-dim": "#ffba42",
                        "tertiary-container": "#885c00",
                        "secondary": "#006a60",
                        "on-tertiary-fixed": "#281800",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "secondary-light": "#B5E8D5",
                        "on-tertiary-fixed-variant": "#614000",
                        "primary-fixed": "#c7e7ff",
                        "primary-light": "#A8D5E2",
                        "primary-fixed-dim": "#8bcefb",
                        "text-primary": "#1A1A2E",
                        "on-secondary-fixed": "#00201c",
                        "danger": "#E76F51",
                        "surface-dim": "#d8dadd",
                        "secondary-container": "#8cf5e4",
                        "secondary-fixed-dim": "#6fd8c8",
                        "text-muted": "#A0AEC0",
                        "tertiary-fixed": "#ffddaf",
                        "surface-container-low": "#f2f4f7",
                        "inverse-surface": "#2d3133",
                        "border": "#E2E8F0",
                        "surface-container-highest": "#e0e3e6",
                        "surface-container": "#eceef1",
                        "on-surface-variant": "#40484e",
                        "on-secondary-container": "#007166",
                        "surface-container-high": "#e6e8eb",
                        "primary-dark": "#0F4C6B",
                        "on-primary-fixed": "#001e2e",
                        "background": "#f7f9fc",
                        "tertiary": "#684600",
                        "surface-tint": "#0e658c",
                        "on-primary-container": "#c7e7ff",
                        "primary-container": "#1b6b93",
                        "secondary-fixed": "#8cf5e4",
                        "on-primary-fixed-variant": "#004c6c",
                        "on-background": "#191c1e",
                        "on-tertiary-container": "#ffdeaf",
                        "text-secondary": "#4A5568",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c0c7cf",
                        "on-secondary-fixed-variant": "#005048",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eff1f4",
                        "surface-bright": "#f7f9fc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-edge": "24px",
                        "gutter-md": "24px",
                        "gutter-sm": "16px",
                        "header-height": "64px",
                        "sidebar-width": "260px"
                    },
                    "fontFamily": {
                        "caption": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .curved-background {
            clip-path: ellipse(110% 80% at 50% 20%);
        }
        input:focus + label, input:not(:placeholder-shown) + label {
            transform: translateY(-1.5rem) scale(0.85);
            background: white;
            padding: 0 0.25rem;
            color: #1b6b93;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center overflow-x-hidden">
<!-- Status Bar Simulation -->
<div class="fixed top-0 w-full h-8 flex items-center justify-end px-4 z-50 pointer-events-none">
<div class="flex gap-1.5 items-center text-on-surface/80">
<span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[16px]">battery_full</span>
<span class="text-[12px] font-bold ml-1">12:30</span>
</div>
</div>
<!-- Top Area (40% Screen) with Curved Wave -->
<div class="relative w-full h-[353px] bg-primary-container curved-background flex flex-col items-center justify-center pt-8 overflow-hidden">
<!-- Background subtle pattern -->
<div class="absolute inset-0 opacity-10 pointer-events-none">

</div>
<!-- Logo & Title -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mb-4 border border-white/30 shadow-xl">
<span class="material-symbols-outlined text-white text-[48px]" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-white tracking-tight">Agenda Médica</h1>
</div>
</div>
<!-- Login Form Area -->
<main class="w-full max-w-md px-margin-edge -mt-10 relative z-20 flex-grow pb-12">
<div class="bg-surface rounded-3xl p-8 shadow-xl">
<!-- Greeting -->
<div class="mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary">Bienvenido</h2>
<p class="font-body-sm text-body-sm text-text-secondary mt-1">Inicia sesión para continuar</p>
</div>
<!-- Inputs Container -->
<form class="space-y-6" onsubmit="return false">
<!-- Email Field -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-4 border border-border rounded-lg text-on-surface bg-white focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all peer" id="email" name="email" placeholder=" " type="email"/>
<label class="absolute left-10 top-4 text-outline font-body-md text-body-md transition-all pointer-events-none peer-focus:text-primary-container" for="email">
                        Correo Electrónico
                    </label>
</div>
<!-- Password Field -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-4 border border-border rounded-lg text-on-surface bg-white focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all peer" id="password" name="password" placeholder=" " type="password"/>
<label class="absolute left-10 top-4 text-outline font-body-md text-body-md transition-all pointer-events-none peer-focus:text-primary-container" for="password">
                        Contraseña
                    </label>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center" id="togglePassword" type="button">
<span class="material-symbols-outlined text-outline hover:text-primary-container transition-colors" id="passwordIcon">visibility</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-label-md text-label-md text-primary-container hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-4 rounded-lg shadow-md hover:bg-primary-dark active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Ingresar</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-grow bg-border"></div>
<span class="text-caption font-caption text-text-muted">O</span>
<div class="h-[1px] flex-grow bg-border"></div>
</div>
<!-- Secondary Action -->
<div>
<button class="w-full border-2 border-primary-container text-primary-container font-label-md text-label-md py-4 rounded-lg hover:bg-primary-container/5 active:scale-[0.98] transition-all" type="button">
                        Crear cuenta nueva
                    </button>
</div>
</form>
</div>
<!-- Branding Footer (Optional) -->
<footer class="mt-12 text-center">
<p class="font-caption text-caption text-text-muted">
                © 2024 MediAdmin. Todos los derechos reservados.
            </p>
</footer>
</main>
<script>
        // Password Visibility Toggle
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('togglePassword');
        const passwordIcon = document.getElementById('passwordIcon');

        toggleButton.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordIcon.innerText = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Simple Form Submission Interaction
        document.querySelector('form').addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Procesando...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Éxito';
                btn.classList.replace('bg-primary-container', 'bg-secondary');
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-secondary', 'bg-primary-container');
                    btn.disabled = false;
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
