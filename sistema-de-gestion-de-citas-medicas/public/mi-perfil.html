<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica - Mi Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .profile-hero {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: var(--radius-card);
            padding: 36px 32px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
        }
        .profile-avatar-large {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: var(--color-secondary);
            color: #FFFFFF;
            font-size: 36px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid rgba(255, 255, 255, 0.2);
        }
        .pass-strength {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }
        .pass-strength-bar {
            height: 4px;
            flex: 1;
            background-color: var(--color-border);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <div class="sidebar__brand-logo">AM</div>
                <span class="sidebar__brand-text">Agenda Médica</span>
            </div>

            <nav class="sidebar__nav">
                <a href="dashboard.html" class="sidebar__link nav-non-doctor"><i data-lucide="home"></i><span>Inicio</span></a>
                <a href="mi-agenda.html" class="sidebar__link nav-doctor-only hidden"><i data-lucide="clipboard-list"></i><span>Mi Agenda</span></a>
                <a href="pacientes.html" class="sidebar__link"><i data-lucide="users"></i><span>Pacientes</span></a>
                <a href="citas.html" class="sidebar__link nav-non-doctor"><i data-lucide="calendar"></i><span>Citas</span></a>
                <a href="doctores.html" class="sidebar__link nav-admin-only"><i data-lucide="user-cog"></i><span>Doctores</span></a>
                <a href="especialidades.html" class="sidebar__link nav-admin-only"><i data-lucide="stethoscope"></i><span>Especialidades</span></a>
                <a href="recepcionistas.html" class="sidebar__link nav-admin-only"><i data-lucide="user-check"></i><span>Recepcionistas</span></a>
                <a href="reportes.html" class="sidebar__link nav-admin-only"><i data-lucide="bar-chart-3"></i><span>Reportes</span></a>
                <a href="mi-perfil.html" class="sidebar__link sidebar__link--active"><i data-lucide="user"></i><span>Mi Perfil</span></a>
            </nav>

            <div class="sidebar__footer">
                <div class="sidebar__user">
                    <div id="lbl_user_avatar" class="sidebar__avatar">U</div>
                    <div class="sidebar__user-info">
                        <span id="lbl_user_name" class="sidebar__user-name">Usuario</span>
                        <span id="lbl_user_role" class="sidebar__user-role">Rol</span>
                    </div>
                </div>
                <button id="btn_logout" class="sidebar__btn-logout" title="Cerrar Sesión"><i data-lucide="log-out"></i></button>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <header class="header">
                <h1 class="header__title">Configuración de Mi Perfil</h1>
                <div class="header__right">
                    <button class="header__notification-btn"><i data-lucide="bell"></i></button>
                </div>
            </header>

            <main class="main-content" style="max-width: 720px; margin: 0 auto;">
                <!-- Profile Hero Header -->
                <div class="profile-hero">
                    <div id="lbl_hero_avatar" class="profile-avatar-large">U</div>
                    <div>
                        <h2 id="lbl_hero_nombre" style="color: #FFFFFF; font-size: 24px; margin-bottom: 4px;">Cargando...</h2>
                        <span id="lbl_hero_rol" class="badge badge--success" style="text-transform: uppercase;">--</span>
                    </div>
                </div>

                <!-- Personal Info Form -->
                <div class="card" style="margin-bottom: 24px;">
                    <h3 style="margin-bottom: 16px; font-size: 16px;">Datos Personales</h3>
                    <form id="form_perfil">
                        <div class="form-group">
                            <label class="form-label">Nombre Completo <i data-lucide="lock" style="font-size: 12px; color: var(--color-text-muted);"></i></label>
                            <input type="text" id="txt_perfil_nombre" class="form-input" disabled style="background-color: var(--color-bg);">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Correo Electrónico <i data-lucide="lock" style="font-size: 12px; color: var(--color-text-muted);"></i></label>
                            <input type="email" id="txt_perfil_email" class="form-input" disabled style="background-color: var(--color-bg);">
                        </div>

                        <div class="form-group">
                            <label for="txt_perfil_telefono" class="form-label">Teléfono de Contacto *</label>
                            <input type="tel" id="txt_perfil_telefono" class="form-input" placeholder="10 dígitos" maxlength="10" required>
                        </div>

                        <div style="display: flex; justify-content: flex-end;">
                            <button type="submit" id="btn_guardar_perfil" class="btn btn-primary">Actualizar Datos</button>
                        </div>
                    </form>
                </div>

                <!-- Password Change Form -->
                <div class="card">
                    <h3 style="margin-bottom: 16px; font-size: 16px; color: var(--color-danger);">Cambiar Contraseña</h3>
                    <form id="form_password">
                        <div class="form-group">
                            <label for="txt_pass_actual" class="form-label">Contraseña Actual *</label>
                            <input type="password" id="txt_pass_actual" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label for="txt_pass_nueva" class="form-label">Nueva Contraseña *</label>
                            <input type="password" id="txt_pass_nueva" class="form-input" minlength="8" required>
                            <div class="pass-strength">
                                <div class="pass-strength-bar" id="bar_strength_1"></div>
                                <div class="pass-strength-bar" id="bar_strength_2"></div>
                                <div class="pass-strength-bar" id="bar_strength_3"></div>
                                <div class="pass-strength-bar" id="bar_strength_4"></div>
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 20px;">
                            <label for="txt_pass_confirm" class="form-label">Confirmar Nueva Contraseña *</label>
                            <input type="password" id="txt_pass_confirm" class="form-input" minlength="8" required>
                        </div>

                        <div style="display: flex; justify-content: flex-end;">
                            <button type="submit" id="btn_cambiar_pass" class="btn btn-outline-danger">Actualizar Contraseña</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="js/ui/perfil-view.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
