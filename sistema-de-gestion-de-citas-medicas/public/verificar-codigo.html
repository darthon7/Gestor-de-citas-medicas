<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica - Verificar Código</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-card__header">
            <div class="auth-card__icon" style="background-color: rgba(42, 157, 143, 0.12); color: var(--color-secondary);">
                <i data-lucide="shield-check"></i>
            </div>
            <h1 class="auth-card__title">Verificar Código</h1>
            <p class="auth-card__subtitle">Ingresa el código enviado a tu correo electrónico.</p>
        </div>

        <div id="div_alerta" class="auth-card__alert oculto"></div>

        <form id="form_verificar" class="auth-card__form">
            <div class="form-group">
                <label for="txt_codigo" class="form-label">Código de 6 dígitos</label>
                <div class="auth-card__input-wrapper">
                    <i data-lucide="hash" class="leading-icon"></i>
                    <input type="text" id="txt_codigo" class="form-input" placeholder="123456" maxlength="6" required style="letter-spacing: 4px; font-weight: 700;">
                </div>
            </div>

            <button type="submit" id="btn_verificar" class="btn btn-primary" style="width: 100%; height: 48px; margin-top: 12px;">
                <span>Verificar Código</span>
            </button>
        </form>

        <div class="auth-card__footer" style="margin-top: 20px;">
            <a href="recuperar-password.html">Reenviar código o cambiar correo</a>
        </div>
    </div>

    <script type="module" src="js/ui/recuperar-view.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
