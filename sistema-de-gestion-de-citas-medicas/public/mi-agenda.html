<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica - Mi Agenda del Día</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/agenda-doctor.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Doctor Sidebar -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <div class="sidebar__brand-logo">AM</div>
                <span class="sidebar__brand-text">Agenda Médica</span>
            </div>

            <nav class="sidebar__nav">
                <a href="mi-agenda.html" class="sidebar__link sidebar__link--active">
                    <i data-lucide="clipboard-list"></i>
                    <span>Mi Agenda</span>
                </a>
                <a href="pacientes.html" class="sidebar__link">
                    <i data-lucide="file-text"></i>
                    <span>Expedientes</span>
                </a>
                <a href="mi-perfil.html" class="sidebar__link">
                    <i data-lucide="user"></i>
                    <span>Mi Perfil</span>
                </a>
            </nav>

            <div class="sidebar__footer">
                <div class="sidebar__user">
                    <div id="lbl_user_avatar" class="sidebar__avatar">DR</div>
                    <div class="sidebar__user-info">
                        <span id="lbl_user_name" class="sidebar__user-name">Dr. Médico</span>
                        <span id="lbl_user_role" class="sidebar__user-role">Doctor</span>
                    </div>
                </div>
                <button id="btn_logout" class="sidebar__btn-logout" title="Cerrar Sesión"><i data-lucide="log-out"></i></button>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <header class="header">
                <h1 class="header__title">Mi Agenda Médica</h1>
                <div class="header__right">
                    <span id="lbl_fecha_hoy" class="header__date">--</span>
                    <button class="header__notification-btn"><i data-lucide="bell"></i></button>
                </div>
            </header>

            <main class="main-content">
                <!-- Welcome Card -->
                <div class="doctor-welcome-card">
                    <h2 id="lbl_saludo_doc" style="margin-bottom: 4px;">Buenos días, Doctor</h2>
                    <p id="lbl_resumen_consultas" style="font-size: 15px;">Cargando resumen de la jornada...</p>
                </div>

                <!-- Agenda Timeline List -->
                <div id="container_agenda_doctor" class="doctor-agenda-timeline">
                    <p style="color: var(--color-text-muted);">Cargando consultas de hoy...</p>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="js/ui/mi-agenda-view.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
