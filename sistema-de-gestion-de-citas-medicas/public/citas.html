<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica - Calendario de Citas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/citas.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <div class="sidebar__brand-logo">AM</div>
                <span class="sidebar__brand-text">Agenda Médica</span>
            </div>

            <nav class="sidebar__nav">
                <a href="dashboard.html" class="sidebar__link"><i data-lucide="home"></i><span>Inicio</span></a>
                <a href="pacientes.html" class="sidebar__link"><i data-lucide="users"></i><span>Pacientes</span></a>
                <a href="citas.html" class="sidebar__link sidebar__link--active"><i data-lucide="calendar"></i><span>Citas</span></a>
                <a href="doctores.html" class="sidebar__link nav-admin-only"><i data-lucide="user-cog"></i><span>Doctores</span></a>
                <a href="especialidades.html" class="sidebar__link nav-admin-only"><i data-lucide="stethoscope"></i><span>Especialidades</span></a>
                <a href="recepcionistas.html" class="sidebar__link nav-admin-only"><i data-lucide="user-check"></i><span>Recepcionistas</span></a>
                <a href="reportes.html" class="sidebar__link nav-admin-only"><i data-lucide="bar-chart-3"></i><span>Reportes</span></a>
            </nav>

            <div class="sidebar__footer">
                <div class="sidebar__user">
                    <div id="lbl_user_avatar" class="sidebar__avatar">U</div>
                    <div class="sidebar__user-info">
                        <span id="lbl_user_name" class="sidebar__user-name">Usuario</span>
                        <span id="lbl_user_role" class="sidebar__user-role">Rol</span>
                    </div>
                </div>
                <button id="btn_logout" class="sidebar__btn-logout" title="Cerrar Sesión"><i data-lucide="log-out"></i></button>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <header class="header">
                <h1 class="header__title">Calendario de Citas</h1>
                <div class="header__right">
                    <button class="header__notification-btn"><i data-lucide="bell"></i></button>
                </div>
            </header>

            <main class="main-content">
                <!-- Control Bar -->
                <div class="calendar-controls">
                    <div style="display: flex; gap: 8px;">
                        <button id="btn_vista_dia" class="btn btn-outline" style="padding: 6px 14px; font-size: 13px;">Día</button>
                        <button id="btn_vista_semana" class="btn btn-primary" style="padding: 6px 14px; font-size: 13px;">Semana</button>
                    </div>

                    <div style="display: flex; align-items: center; gap: 16px;">
                        <button id="btn_anterior_semana" class="btn btn-icon"><i data-lucide="chevron-left"></i></button>
                        <span id="lbl_rango_fecha" style="font-weight: 700; font-size: 16px; min-width: 220px; text-align: center;">--</span>
                        <button id="btn_siguiente_semana" class="btn btn-icon"><i data-lucide="chevron-right"></i></button>
                    </div>

                    <div style="display: flex; gap: 12px;">
                        <select id="sel_filtro_doctor_cal" class="form-select" style="width: 200px;">
                            <option value="">Todos los doctores</option>
                        </select>
                        <a href="agendar-cita.html" class="btn btn-primary">
                            <i data-lucide="plus"></i> Nueva Cita
                        </a>
                    </div>
                </div>

                <!-- Calendar Main Grid & Right Summary Layout -->
                <div style="display: grid; grid-template-columns: 1fr 300px; gap: 24px;">
                    <!-- Calendar Grid -->
                    <div id="calendar_grid" class="calendar-grid">
                        <div class="calendar-header-col" style="background-color: var(--color-bg);">Hora</div>
                        <div class="calendar-header-col">Lun</div>
                        <div class="calendar-header-col">Mar</div>
                        <div class="calendar-header-col">Mié</div>
                        <div class="calendar-header-col">Jue</div>
                        <div class="calendar-header-col">Vie</div>
                        <div class="calendar-header-col">Sáb</div>
                        <div class="calendar-header-col">Dom</div>

                        <!-- Hora 8:00 - 18:00 generadas dinámicamente -->
                        <div class="calendar-time-col" id="col_time"></div>
                        <div class="calendar-day-col" id="day_col_0"></div>
                        <div class="calendar-day-col" id="day_col_1"></div>
                        <div class="calendar-day-col" id="day_col_2"></div>
                        <div class="calendar-day-col" id="day_col_3"></div>
                        <div class="calendar-day-col" id="day_col_4"></div>
                        <div class="calendar-day-col" id="day_col_5"></div>
                        <div class="calendar-day-col" id="day_col_6"></div>
                    </div>

                    <!-- Right Summary Panel -->
                    <div class="card" style="height: fit-content;">
                        <h3 style="margin-bottom: 16px;">Resumen del Día</h3>
                        <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
                            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                                <span>Citas programadas:</span>
                                <strong id="summary_total">0</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                                <span>Confirmadas:</span>
                                <strong id="summary_confirmadas" style="color: var(--color-secondary);">0</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                                <span>Canceladas:</span>
                                <strong id="summary_canceladas" style="color: var(--color-danger);">0</strong>
                            </div>
                        </div>

                        <h4 style="margin-bottom: 12px; font-size: 14px;">Próximas para Hoy</h4>
                        <div id="container_resumen_hoy" style="display: flex; flex-direction: column; gap: 10px;">
                            <p style="color: var(--color-text-muted); font-size: 12px;">Cargando resumen...</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="js/ui/citas-view.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
