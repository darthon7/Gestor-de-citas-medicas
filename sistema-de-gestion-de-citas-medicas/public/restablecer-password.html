<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica - Restablecer Contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-card__header">
            <div class="auth-card__icon">
                <i data-lucide="lock"></i>
            </div>
            <h1 class="auth-card__title">Nueva Contraseña</h1>
            <p class="auth-card__subtitle">Ingresa tu nueva contraseña para actualizar el acceso.</p>
        </div>

        <div id="div_alerta" class="auth-card__alert oculto"></div>

        <form id="form_restablecer" class="auth-card__form">
            <div class="form-group">
                <label for="txt_new_pass" class="form-label">Nueva Contraseña</label>
                <div class="auth-card__input-wrapper">
                    <i data-lucide="key" class="leading-icon"></i>
                    <input type="password" id="txt_new_pass" class="form-input" placeholder="Mínimo 8 caracteres" required minlength="8">
                </div>
            </div>

            <div class="form-group">
                <label for="txt_confirm_pass" class="form-label">Confirmar Nueva Contraseña</label>
                <div class="auth-card__input-wrapper">
                    <i data-lucide="check-circle" class="leading-icon"></i>
                    <input type="password" id="txt_confirm_pass" class="form-input" placeholder="Repite la contraseña" required minlength="8">
                </div>
            </div>

            <button type="submit" id="btn_restablecer" class="btn btn-primary" style="width: 100%; height: 48px; margin-top: 12px;">
                <span>Guardar Nueva Contraseña</span>
            </button>
        </form>
    </div>

    <script type="module" src="js/ui/recuperar-view.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
