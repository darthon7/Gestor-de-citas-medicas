<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica - Registrar Diagnóstico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <div class="sidebar__brand-logo">AM</div>
                <span class="sidebar__brand-text">Agenda Médica</span>
            </div>

            <nav class="sidebar__nav">
                <a href="mi-agenda.html" class="sidebar__link sidebar__link--active">
                    <i data-lucide="clipboard-list"></i>
                    <span>Mi Agenda</span>
                </a>
                <a href="pacientes.html" class="sidebar__link">
                    <i data-lucide="file-text"></i>
                    <span>Expedientes</span>
                </a>
                <a href="mi-perfil.html" class="sidebar__link">
                    <i data-lucide="user"></i>
                    <span>Mi Perfil</span>
                </a>
            </nav>

            <div class="sidebar__footer">
                <div class="sidebar__user">
                    <div id="lbl_user_avatar" class="sidebar__avatar">DR</div>
                    <div class="sidebar__user-info">
                        <span id="lbl_user_name" class="sidebar__user-name">Dr. Médico</span>
                        <span id="lbl_user_role" class="sidebar__user-role">Doctor</span>
                    </div>
                </div>
                <button id="btn_logout" class="sidebar__btn-logout" title="Cerrar Sesión"><i data-lucide="log-out"></i></button>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <header class="header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <a href="mi-agenda.html" class="btn btn-icon"><i data-lucide="arrow-left"></i></a>
                    <h1 class="header__title">Registro de Consulta y Diagnóstico</h1>
                </div>
            </header>

            <main class="main-content" style="max-width: 800px; margin: 0 auto;">
                <!-- Patient Mini Card -->
                <div class="card" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div id="lbl_pac_avatar" class="sidebar__avatar" style="width: 52px; height: 52px; font-size: 20px;">JG</div>
                        <div>
                            <h3 id="lbl_pac_nombre">Cargando Paciente...</h3>
                            <span id="lbl_pac_meta" style="font-size: 13px; color: var(--color-text-secondary);">Exp: -- | Cita: --</span>
                        </div>
                    </div>
                    <span class="badge badge--info"><span class="pulsing-dot"></span> En Consulta</span>
                </div>

                <!-- Form Card -->
                <form id="form_diagnostico">
                    <div class="card" style="margin-bottom: 24px;">
                        <!-- Section 1: Signos Vitales -->
                        <div style="margin-bottom: 24px;">
                            <h3 style="font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; color: var(--color-danger);">
                                <i data-lucide="heart-pulse"></i> Signos Vitales
                            </h3>
                            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                                <div class="form-group">
                                    <label for="inp_presion" class="form-label">Presión (mmHg)</label>
                                    <input type="text" id="inp_presion" class="form-input" placeholder="120/80">
                                </div>
                                <div class="form-group">
                                    <label for="inp_frecuencia" class="form-label">FC (bpm)</label>
                                    <input type="number" id="inp_frecuencia" class="form-input" placeholder="72">
                                </div>
                                <div class="form-group">
                                    <label for="inp_temperatura" class="form-label">Temp (°C)</label>
                                    <input type="text" id="inp_temperatura" class="form-input" placeholder="36.5">
                                </div>
                                <div class="form-group">
                                    <label for="inp_peso" class="form-label">Peso (kg)</label>
                                    <input type="text" id="inp_peso" class="form-input" placeholder="70">
                                </div>
                            </div>
                        </div>

                        <hr style="border: 0; border-top: 1px solid var(--color-border); margin-bottom: 24px;">

                        <!-- Section 2: Diagnóstico -->
                        <div class="form-group" style="margin-bottom: 24px;">
                            <h3 style="font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--color-primary);">
                                <i data-lucide="clipboard"></i> Diagnóstico Médico *
                            </h3>
                            <textarea id="txt_diagnostico" class="form-textarea" rows="5" placeholder="Descripción detallada del diagnóstico del paciente..." required></textarea>
                        </div>

                        <hr style="border: 0; border-top: 1px solid var(--color-border); margin-bottom: 24px;">

                        <!-- Section 3: Tratamiento Indicado -->
                        <div class="form-group" style="margin-bottom: 24px;">
                            <h3 style="font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--color-secondary);">
                                <i data-lucide="pill"></i> Tratamiento y Recomendaciones *
                            </h3>
                            <textarea id="txt_tratamiento" class="form-textarea" rows="4" placeholder="Medicamentos, dosis y recomendaciones clínicas..." required></textarea>
                        </div>

                        <!-- Section 4: Notas Adicionales -->
                        <div class="form-group">
                            <label for="txt_notas_adicionales" class="form-label">Observaciones Adicionales (Opcional)</label>
                            <textarea id="txt_notas_adicionales" class="form-textarea" rows="3" placeholder="Comentarios adicionales o notas internas..."></textarea>
                        </div>
                    </div>

                    <!-- Actions Bar -->
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <button type="button" id="btn_guardar_borrador" class="btn btn-outline">
                            Guardar Borrador
                        </button>

                        <button type="submit" id="btn_completar_consulta" class="btn btn-secondary" style="padding: 12px 24px;">
                            <i data-lucide="check-circle"></i> Completar Consulta Médica
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script type="module" src="js/ui/diagnostico-view.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
