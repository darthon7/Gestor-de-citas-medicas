<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica - Registro de Pacientes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .auth-card--wide {
            max-width: 560px;
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-card auth-card--wide">
        <div class="auth-card__header">
            <div class="auth-card__icon" style="background-color: rgba(42, 157, 143, 0.12); color: var(--color-secondary);">
                <i data-lucide="user-plus"></i>
            </div>
            <h1 class="auth-card__title">Crear Cuenta de Paciente</h1>
            <p class="auth-card__subtitle">Completa el formulario para registrarte en el sistema de citas médicas.</p>
        </div>

        <div id="div_alerta_error" class="auth-card__alert oculto"></div>

        <form id="form_registro" class="auth-card__form">
            <div class="form-group">
                <label for="txt_nombre" class="form-label">Nombre Completo *</label>
                <div class="auth-card__input-wrapper">
                    <i data-lucide="user" class="leading-icon"></i>
                    <input type="text" id="txt_nombre" class="form-input" placeholder="Juan García Hernández" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="txt_curp" class="form-label">CURP *</label>
                    <div class="auth-card__input-wrapper">
                        <i data-lucide="id-card" class="leading-icon"></i>
                        <input type="text" id="txt_curp" class="form-input" placeholder="18 caracteres" maxlength="18" required style="text-transform: uppercase;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="txt_email" class="form-label">Correo Electrónico *</label>
                    <div class="auth-card__input-wrapper">
                        <i data-lucide="mail" class="leading-icon"></i>
                        <input type="email" id="txt_email" class="form-input" placeholder="correo@ejemplo.com" required>
                    </div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="txt_telefono" class="form-label">Teléfono *</label>
                    <div class="auth-card__input-wrapper">
                        <i data-lucide="phone" class="leading-icon"></i>
                        <input type="tel" id="txt_telefono" class="form-input" placeholder="10 dígitos" maxlength="10" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="inp_fecha_nac" class="form-label">Fecha de Nacimiento</label>
                    <div class="auth-card__input-wrapper">
                        <i data-lucide="calendar" class="leading-icon"></i>
                        <input type="date" id="inp_fecha_nac" class="form-input">
                    </div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="sel_sexo" class="form-label">Sexo</label>
                    <select id="sel_sexo" class="form-select">
                        <option value="">Seleccione...</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="txt_nss" class="form-label">NSS (Opcional)</label>
                    <div class="auth-card__input-wrapper">
                        <i data-lucide="shield" class="leading-icon"></i>
                        <input type="text" id="txt_nss" class="form-input" placeholder="Número de Seg. Social">
                    </div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="txt_password" class="form-label">Contraseña *</label>
                    <div class="auth-card__input-wrapper">
                        <i data-lucide="lock" class="leading-icon"></i>
                        <input type="password" id="txt_password" class="form-input" placeholder="Mínimo 8 caracteres" minlength="8" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="txt_password_confirm" class="form-label">Confirmar Contraseña *</label>
                    <div class="auth-card__input-wrapper">
                        <i data-lucide="check-circle" class="leading-icon"></i>
                        <input type="password" id="txt_password_confirm" class="form-input" placeholder="Repite contraseña" minlength="8" required>
                    </div>
                </div>
            </div>

            <button type="submit" id="btn_registrar" class="btn btn-primary" style="width: 100%; height: 48px; margin-top: 12px;">
                <span>Registrar Cuenta</span>
            </button>
        </form>

        <div class="auth-card__footer" style="margin-top: 20px;">
            <p>¿Ya tienes una cuenta? <a href="login.html" style="font-weight: 600;">Inicia sesión aquí</a></p>
        </div>
    </div>

    <script type="module" src="js/ui/registro-view.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
