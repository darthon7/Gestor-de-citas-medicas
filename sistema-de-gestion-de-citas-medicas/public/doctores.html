<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica - Gestión de Doctores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/doctores.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <div class="sidebar__brand-logo">AM</div>
                <span class="sidebar__brand-text">Agenda Médica</span>
            </div>

            <nav class="sidebar__nav">
                <a href="dashboard.html" class="sidebar__link"><i data-lucide="home"></i><span>Inicio</span></a>
                <a href="pacientes.html" class="sidebar__link"><i data-lucide="users"></i><span>Pacientes</span></a>
                <a href="citas.html" class="sidebar__link"><i data-lucide="calendar"></i><span>Citas</span></a>
                <a href="doctores.html" class="sidebar__link sidebar__link--active"><i data-lucide="user-cog"></i><span>Doctores</span></a>
                <a href="especialidades.html" class="sidebar__link"><i data-lucide="stethoscope"></i><span>Especialidades</span></a>
                <a href="recepcionistas.html" class="sidebar__link"><i data-lucide="user-check"></i><span>Recepcionistas</span></a>
                <a href="reportes.html" class="sidebar__link"><i data-lucide="bar-chart-3"></i><span>Reportes</span></a>
            </nav>

            <div class="sidebar__footer">
                <div class="sidebar__user">
                    <div id="lbl_user_avatar" class="sidebar__avatar">U</div>
                    <div class="sidebar__user-info">
                        <span id="lbl_user_name" class="sidebar__user-name">Usuario</span>
                        <span id="lbl_user_role" class="sidebar__user-role">Rol</span>
                    </div>
                </div>
                <button id="btn_logout" class="sidebar__btn-logout" title="Cerrar Sesión"><i data-lucide="log-out"></i></button>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <header class="header">
                <h1 class="header__title">Gestión de Doctores</h1>
                <div class="header__right">
                    <button class="header__notification-btn"><i data-lucide="bell"></i></button>
                </div>
            </header>

            <main class="main-content">
                <!-- Action Bar -->
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px;">
                    <div style="display: flex; gap: 12px; flex: 1; max-width: 600px;">
                        <div style="position: relative; flex: 1;">
                            <i data-lucide="search" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"></i>
                            <input type="text" id="inp_buscar_doctor" class="form-input" placeholder="Buscar doctor por nombre..." style="padding-left: 44px;">
                        </div>
                        <select id="sel_filtro_especialidad" class="form-select" style="width: 220px;">
                            <option value="">Todas las Especialidades</option>
                        </select>
                    </div>

                    <button id="btn_abrir_modal_doctor" class="btn btn-primary">
                        <i data-lucide="user-plus"></i>
                        <span>+ Registrar Doctor</span>
                    </button>
                </div>

                <!-- Doctors Cards Grid -->
                <div id="grid_doctores" class="doctors-grid">
                    <p style="color: var(--color-text-muted);">Cargando plantilla médica...</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Registro / Edición Doctor -->
    <div id="modal_doctor" class="modal-overlay">
        <div class="modal" style="max-width: 560px;">
            <div class="modal__header">
                <h3 id="modal_doctor_title" class="modal__title">Registrar Nuevo Doctor</h3>
                <span class="modal__close">&times;</span>
            </div>

            <form id="form_doctor">
                <div class="modal__body">
                    <input type="hidden" id="txt_doctor_id">

                    <div class="form-group">
                        <label for="txt_nombre_doc" class="form-label">Nombre Completo *</label>
                        <input type="text" id="txt_nombre_doc" class="form-input" placeholder="Dr. Roberto Sánchez" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="sel_especialidad_doc" class="form-label">Especialidad *</label>
                            <select id="sel_especialidad_doc" class="form-select" required>
                                <option value="">Seleccione...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="txt_cedula" class="form-label">Cédula Profesional *</label>
                            <input type="text" id="txt_cedula" class="form-input" placeholder="8 dígitos" maxlength="10" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="txt_telefono_doc" class="form-label">Teléfono *</label>
                            <input type="tel" id="txt_telefono_doc" class="form-input" placeholder="10 dígitos" maxlength="10" required>
                        </div>
                        <div class="form-group">
                            <label for="txt_email_doc" class="form-label">Correo Electrónico *</label>
                            <input type="email" id="txt_email_doc" class="form-input" placeholder="doctor@clinicamedica.com" required>
                        </div>
                    </div>
                </div>

                <div class="modal__footer">
                    <button type="button" class="btn btn-outline modal__close">Cancelar</button>
                    <button type="submit" id="btn_guardar_doctor" class="btn btn-primary">Registrar Doctor</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/ui/doctores-view.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
