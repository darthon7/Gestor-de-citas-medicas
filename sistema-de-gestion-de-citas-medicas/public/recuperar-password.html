<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica - Recuperar Contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-card__header">
            <div class="auth-card__icon" style="background-color: rgba(233, 163, 25, 0.12); color: var(--color-accent);">
                <i data-lucide="key-round"></i>
            </div>
            <h1 class="auth-card__title">Recuperar Contraseña</h1>
            <p class="auth-card__subtitle">Ingresa tu correo electrónico registrado y te enviaremos un código de recuperación.</p>
        </div>

        <div id="div_alerta" class="auth-card__alert oculto"></div>

        <form id="form_solicitar" class="auth-card__form">
            <div class="form-group">
                <label for="txt_email" class="form-label">Correo Electrónico</label>
                <div class="auth-card__input-wrapper">
                    <i data-lucide="mail" class="leading-icon"></i>
                    <input type="email" id="txt_email" class="form-input" placeholder="ejemplo@clinicamedica.com" required>
                </div>
            </div>

            <button type="submit" id="btn_enviar" class="btn btn-primary" style="width: 100%; height: 48px; margin-top: 12px;">
                <span>Enviar Código de Recuperación</span>
            </button>
        </form>

        <div class="auth-card__footer" style="margin-top: 20px;">
            <a href="login.html" style="display: inline-flex; align-items: center; gap: 6px;">
                <i data-lucide="arrow-left" style="font-size: 14px;"></i> Volver al inicio de sesión
            </a>
        </div>
    </div>

    <script type="module" src="js/ui/recuperar-view.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
