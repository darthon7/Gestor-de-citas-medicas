<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica - Inicio de Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-card__header">
            <div class="auth-card__icon">
                <i data-lucide="activity"></i>
            </div>
            <h1 class="auth-card__title">Agenda Médica</h1>
            <p class="auth-card__subtitle">Sistema de Gestión de Citas Médicas</p>
        </div>

        <div id="div_alerta_error" class="auth-card__alert oculto"></div>

        <form id="form_login" class="auth-card__form">
            <div class="form-group">
                <label for="txt_email" class="form-label">Correo Electrónico</label>
                <div class="auth-card__input-wrapper">
                    <i data-lucide="mail" class="leading-icon"></i>
                    <input type="email" id="txt_email" class="form-input" placeholder="ejemplo@clinicamedica.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="txt_password" class="form-label">Contraseña</label>
                <div class="auth-card__input-wrapper">
                    <i data-lucide="lock" class="leading-icon"></i>
                    <input type="password" id="txt_password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" id="btn_toggle_pass" class="toggle-password" tabindex="-1">
                        <i data-lucide="eye" id="icon_eye"></i>
                    </button>
                </div>
            </div>

            <div class="auth-card__forgot">
                <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" id="btn_ingresar" class="btn btn-primary" style="width: 100%; height: 48px;">
                <span>Ingresar</span>
            </button>
        </form>

        <div class="auth-card__footer">
            <p style="margin-bottom: 8px;">¿No tienes una cuenta? <a href="registro.html" style="font-weight: 600;">Regístrate aquí</a></p>
            <p>© 2026 Agenda Médica — Centro de Salud</p>
        </div>
    </div>

    <script type="module" src="js/ui/login-view.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
